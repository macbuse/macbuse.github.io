<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Flashcard Automaton</title>
        <script>
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        // If local, use standard relative path. If on GitHub, prepend the repo name.
        cssLink.href = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' 
            ? './cards.css?v=1' 
            : '/CHINESE/cards.css?v=1';
        document.head.appendChild(cssLink);
    </script>
</head>
<body>

<div id="flashcard" class="card">
    <!-- Front/Back structural components collapsed into a scannable uniform display -->
    <h1 id="pinyin-text">--</h1>
    <p id="hanzi-text">--</p>
    <p id="english-text">--</p>
</div>

<div id="controls">
    <button id="btn-reveal">Show Meaning</button>
    <button id="btn-repeat">Repeat Audio</button>
    <button id="btn-next">Next Card</button>
    <button id="btn-exit">Exit</button>
</div>

<script>
let flashcards = [];
let currentIndex = 0;
let currentAudio = null;
let audioTimeout = null; // Tracks our delay timer
const playbackSpeed = 0.7;

async function initApp() {
    try {
        const response = await fetch('mandarin_flashcards.json');
        flashcards = await response.json();
        
        if (flashcards.length > 0) {
           // Shuffle the flashcards array randomly
           for (let i = flashcards.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
           }

            // Initial load executes immediately without delay
            showCard(currentIndex, true); 
        } else {
            console.error("Flashcard deck is empty.");
        }
    } catch (error) {
        console.error("Failed to load flashcard data:", error);
    }
}

function showCard(index, autoPlayWithDelay = false) {
    // Clear any pending audio timer from a previous card skip
    if (audioTimeout) {
        clearTimeout(audioTimeout);
    }

    const card = flashcards[index];
    
    document.getElementById('hanzi-text').innerText = card.hanzi;
    document.getElementById('pinyin-text').innerText = card.pinyin;
    document.getElementById('english-text').innerText = card.english;
    
    // Hide meaning components initially
    document.getElementById('pinyin-text').style.visibility = 'hidden';
    document.getElementById('english-text').style.visibility = 'hidden';
    
    if (card.audio_src) {
        currentAudio = new Audio(card.audio_src);
        document.getElementById('btn-repeat').disabled = false;
        
        // Trigger the delayed audio engine if coming from the 'Next' event
        if (autoPlayWithDelay) {
            audioTimeout = setTimeout(() => {
                playAudio();
            }, 500); // 500ms delay. Adjust this value to make it shorter or longer.
        }
    } else {
        currentAudio = null;
        document.getElementById('btn-repeat').disabled = true;
    }
}

function playAudio() {
    if (currentAudio) {
        currentAudio.currentTime = 0; 
	currentAudio.playbackRate = playbackSpeed;
        currentAudio.play().catch(err => console.log("Audio playback configuration note:", err));
    }
}

// --- CONTROLS EVENT LISTENERS ---

// Reveal Meaning Button
document.getElementById('btn-reveal').addEventListener('click', () => {
    document.getElementById('pinyin-text').style.visibility = 'visible';
    document.getElementById('english-text').style.visibility = 'visible';
    // If you already played it on 'Next', this safely re-plays it or plays it if missed
    playAudio(); 
});

// Repeat Audio Button
document.getElementById('btn-repeat').addEventListener('click', () => {
    playAudio();
});

// Next Card Button
document.getElementById('btn-next').addEventListener('click', () => {
    if (flashcards.length === 0) return;
    
    currentIndex = (currentIndex + 1) % flashcards.length;
    // Pass 'true' here to authorize the audio delay engine
    showCard(currentIndex, true);
});

// Exit Button
document.getElementById('btn-exit').addEventListener('click', () => {
    alert("Session completed! Great work.");
    window.location.reload(); 
});

initApp();
</script>

</body>
</html>
